name: rebuild-readme
on:
  schedule: [{ cron: "0 4 * * *" }]   # 04:00 UTC daily (raise to hourly for a livelier Life)
  workflow_dispatch:
  push:
    paths: [generate.py, "engine/**", README.tpl.md]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python generate.py && python engine/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "readme-engine"
          git config user.email "actions@users.noreply.github.com"
          git add README.md assets engine/state
          git diff --cached --quiet || (git commit -m "chore: self-compile $(date -u +%F)" && git push)
